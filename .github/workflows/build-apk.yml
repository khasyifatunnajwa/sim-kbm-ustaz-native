name: Build SIM KBM Ustaz Native APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Android SDK yang dibutuhkan
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Izinkan Gradle Wrapper berjalan
        run: chmod +x gradlew

      - name: Bangun APK debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-kbm-ustaz-native-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
