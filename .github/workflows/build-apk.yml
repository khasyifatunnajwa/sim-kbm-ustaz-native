name: Build SIM KBM Ustaz Native APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-native/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-native/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android-native/gradlew
      working-directory: android-native

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon
      working-directory: android-native
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: sim-kbm-ustaz-native-debug
        path: android-native/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload mapping file (for release builds)
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: mapping-file
        path: android-native/app/build/outputs/mapping/debug/
        retention-days: 30
