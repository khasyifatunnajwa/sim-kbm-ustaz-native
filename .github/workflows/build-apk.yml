name: Build SIM KBM Ustaz Native APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          echo "SDK=$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          elif command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager already available"
          else
            echo "ERROR: sdkmanager not found in Android SDK."
            echo "Available SDK directories:"
            ls -la "$SDK"
            ls -la "$SDK/cmdline-tools" || true
            exit 1
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --version
          sdkmanager --licenses </dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sim-kbm-ustaz-native-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
